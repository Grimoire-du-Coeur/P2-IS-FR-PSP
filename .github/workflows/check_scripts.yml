name: Script Check

on:
  pull_request:
    paths:
      - 'traduction/**/*.json'

jobs:
  check_scripts:
    name: Check Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Filter changed scripts
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            changed:
              - 'traduction/**/*.json'
          list-files: 'escape'

      - name: Run Script Validation
        if: ${{ steps.filter.outputs.changed == 'true' }}
        run: |
          python -m p2is.outils.verify_json ${{ steps.filter.outputs.changed_files }}

      # Une replique recopiee d'une entree a l'autre passe toutes les autres
      # verifications : balises intactes, longueur tenue, verify_json content.
      # En jeu, plusieurs personnages disent la meme phrase.
      #
      # Le plafond correspond a la dette connue au 04/11/2026 : l'etape ne
      # bloque donc pas l'existant, seulement son aggravation. A baisser au fur
      # et a mesure des corrections, jusqu'a pouvoir le retirer.
      - name: Repliques recopiees d'une entree a l'autre
        if: always()
        run: |
          set +e
          python -m p2is.outils.doublons_traduction --resume --plafond 437 \
            | tee doublons.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '### Repliques francaises recopiees'
            echo
            echo '```'
            cat doublons.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
