<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250"
     viewBox="0 0 1200 250" role="img"
     aria-label="Extraits de dialogues traduits en francais">
  <title>Le jeu, en francais</title>
  <defs>
    <clipPath id="cadre"><rect width="1200" height="250" rx="4"/></clipPath>
  </defs>
  <style>
    @keyframes vis0 { 0%,0.000% { opacity: 0; } 0.000%,23.232% { opacity: 1; } 23.832%,100% { opacity: 0; } }
    @keyframes tape0 { 0%,0.000% { transform: translateX(0); } 8.829%,100% { transform: translateX(428px); } }
    @keyframes vis1 { 0%,23.822% { opacity: 0; } 23.832%,48.102% { opacity: 1; } 48.702%,100% { opacity: 0; } }
    @keyframes tape1 { 0%,23.832% { transform: translateX(0); } 33.699%,100% { transform: translateX(479px); } }
    @keyframes vis2 { 0%,48.692% { opacity: 0; } 48.702%,73.232% { opacity: 1; } 73.832%,100% { opacity: 0; } }
    @keyframes tape2 { 0%,48.702% { transform: translateX(0); } 58.829%,100% { transform: translateX(491px); } }
    @keyframes vis3 { 0%,73.822% { opacity: 0; } 73.832%,99.400% { opacity: 1; } 100.000%,100% { opacity: 0; } }
    @keyframes tape3 { 0%,73.832% { transform: translateX(0); } 84.997%,100% { transform: translateX(542px); } }
    @keyframes clignote { 0%,45% { opacity: 1; } 55%,100% { opacity: 0; } }
    .fleche { animation: clignote 1.1s steps(1) infinite; }
    .chapeau { font: 600 13px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                letter-spacing: 3.6px; }
    .nom { font: 700 15px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .dlg { font: 400 21px 'Cascadia Mono','Consolas','DejaVu Sans Mono','Menlo',monospace; }
    .src { font: 400 11px 'Cascadia Mono','Consolas','DejaVu Sans Mono','Menlo',monospace; }
    @media (prefers-reduced-motion: reduce) {
      g[style*="animation"] { animation: none !important; }
      .fleche { animation: none; }
    }
  </style>
  <g clip-path="url(#cadre)">
    <rect width="1200" height="250" fill="#e8411f"/>
    <text x="56" y="48" class="chapeau" fill="#4a1207">LE JEU, EN FRAN&#199;AIS</text>

    <rect x="56" y="72" width="1088" height="150" rx="3"
          fill="#190704" stroke="#190704" stroke-width="2"/>

    <g style="animation: vis0 17.33s linear infinite">
      <rect x="92" y="88" width="100" height="30" rx="2" fill="#f7ece4"/>
      <text x="142" y="109" class="nom" fill="#e8411f" text-anchor="middle">Lyc&#233;enne</text>
      <text x="104" y="166" class="dlg" fill="#f7ece4">&#199;a s&#39;appelle le jeu Persona, et...</text>
      <g style="animation: tape0 17.33s steps(34) infinite">
        <rect x="104" y="146" width="3" height="26" fill="#e8411f"/>
        <rect x="107" y="140" width="960" height="40" fill="#190704"/>
      </g>
      <text x="1112" y="196" class="src" fill="#8a634f" text-anchor="end">script_107.json</text>
    </g>
    <g style="animation: vis1 17.33s linear infinite">
      <rect x="92" y="88" width="63" height="30" rx="2" fill="#f7ece4"/>
      <text x="123" y="109" class="nom" fill="#e8411f" text-anchor="middle">Maya</text>
      <text x="104" y="166" class="dlg" fill="#f7ece4">Ouuaaah! Trop cool, Yukki! Regarde &#231;a!</text>
      <g style="animation: tape1 17.33s steps(38) infinite">
        <rect x="104" y="146" width="3" height="26" fill="#e8411f"/>
        <rect x="107" y="140" width="960" height="40" fill="#190704"/>
      </g>
      <text x="1112" y="196" class="src" fill="#8a634f" text-anchor="end">script_009.json</text>
    </g>
    <g style="animation: vis2 17.33s linear infinite">
      <rect x="92" y="88" width="90" height="30" rx="2" fill="#f7ece4"/>
      <text x="137" y="109" class="nom" fill="#e8411f" text-anchor="middle">Eikichi</text>
      <text x="104" y="166" class="dlg" fill="#f7ece4">Prends tes responsabilit&#233;s et r&#232;gle &#231;a!</text>
      <g style="animation: tape2 17.33s steps(39) infinite">
        <rect x="104" y="146" width="3" height="26" fill="#e8411f"/>
        <rect x="107" y="140" width="960" height="40" fill="#190704"/>
      </g>
      <text x="1112" y="196" class="src" fill="#8a634f" text-anchor="end">script_008.json</text>
    </g>
    <g style="animation: vis3 17.33s linear infinite">
      <rect x="92" y="88" width="72" height="30" rx="2" fill="#f7ece4"/>
      <text x="128" y="109" class="nom" fill="#e8411f" text-anchor="middle">Ginko</text>
      <text x="104" y="166" class="dlg" fill="#f7ece4">&#201;trange, sa pr&#233;sence me rend nostalgique...</text>
      <g style="animation: tape3 17.33s steps(43) infinite">
        <rect x="104" y="146" width="3" height="26" fill="#e8411f"/>
        <rect x="107" y="140" width="960" height="40" fill="#190704"/>
      </g>
      <text x="1112" y="196" class="src" fill="#8a634f" text-anchor="end">script_009.json</text>
    </g>

    <path class="fleche" d="M1104 202 l10 0 l-5 9 z" fill="#e8411f"/>
    <rect x="1" y="1" width="1198" height="248" rx="4" fill="none"
          stroke="#19070426" stroke-width="2"/>
  </g>
</svg>
